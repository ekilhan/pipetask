apiVersion: apps/v1
kind: Deployment
metadata:
  name: react
  namespace: pipetask
  labels:
    app: react
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react
  template:
    metadata:
      labels:
        app: react
        tier: frontend
    spec:
      imagePullSecrets:
        - name: regcred
      initContainers:
      - name: wait-for-nodejs
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z nodejs 5000; do echo waiting for nodejs; sleep 2; done;']
      containers:
      - name: react
        image: ${ECR_REGISTRY}/project-repo/pipetask:react
        ports:
        - containerPort: 3000
          name: react-port
        # Note: REACT_APP_* env vars are embedded at build time, not runtime
        # The API URL is set via .env file during Docker build (see Jenkinsfile)
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: react
  namespace: pipetask
  labels:
    app: react
    tier: frontend
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30001
    protocol: TCP
    name: react-port
  selector:
    app: react
