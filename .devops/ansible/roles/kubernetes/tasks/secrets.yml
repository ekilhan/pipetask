---
# Secrets management tasks

- name: Get ECR login password
  shell: aws ecr get-login-password --region {{ aws_region }}
  register: ecr_password
  delegate_to: localhost
  become: false

- name: Create ECR registry secret
  shell: |
    kubectl delete secret regcred -n {{ namespace }} --ignore-not-found
    kubectl create secret docker-registry regcred \
      --docker-server={{ ecr_registry }} \
      --docker-username=AWS \
      --docker-password='{{ ecr_password.stdout }}' \
      -n {{ namespace }}
  become_user: ubuntu
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

- name: Create database credentials secret
  shell: |
    kubectl apply -f - <<EOF
    apiVersion: v1
    kind: Secret
    metadata:
      name: db-credentials
      namespace: {{ namespace }}
    type: Opaque
    stringData:
      postgres-password: "{{ db_password }}"
    EOF
  become_user: ubuntu
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
