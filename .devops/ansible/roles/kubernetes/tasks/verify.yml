---
# Verification tasks

- name: Get all pods in namespace
  shell: kubectl get pods -n {{ namespace }} -o wide
  become_user: ubuntu
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: pods

- name: Display pod status
  debug:
    msg: "{{ pods.stdout_lines }}"

- name: Get all services in namespace
  shell: kubectl get svc -n {{ namespace }}
  become_user: ubuntu
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: services

- name: Display service status
  debug:
    msg: "{{ services.stdout_lines }}"

- name: Check application health
  uri:
    url: "http://{{ master_public_ip }}:30001"
    method: GET
    status_code: 200
  register: health_check
  until: health_check.status == 200
  retries: 10
  delay: 30
  ignore_errors: true

- name: Display application URL
  debug:
    msg: "Application URL: http://{{ master_public_ip }}:30001"
